<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Basics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Homepage</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="col-12 text-center bg-danger">
        <h1>News website</h1>
        <p>Lots of news</p>
    </div>
    <div class="container"></div>
    <div class="row">
        <div class="col-8 ">Breaking news
        <button class="btn btn-primary btn-sm" type="submit">More</button>
        </div>
        <div class="col-4 bg-warning">
            <div class="row">
                <div class="col-8">Sidebar 1</div>
                <div class="col-8">Sidebar 2</div>
                <div class="col-8">Sidebar 3</div>
            </div>
        </div>
    </div>

    
    <div class="row bg-primary">
        <div class="col-3 border">Story 1</div>
        <div class="col-3 border">Story 2</div>
        <div class="col-3 border">Story 3</div>
        <div class="col-3 border">Story 4</div>
    </div>

    <div class="row">
        <div class="col-4 bg-info border">Lower Story 1</div>
        <div class="col-4 bg-info border">Lower Story 2</div>
        <div class="col-4 bg-info border">Lower Story 3</div>
    </div>

    <div class="row bg-dark">
        <div class="col-12 text-center text-white p-3">
            <p>&copy; 2025 News Website - All Rights Reserved</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
</body>
</html>
